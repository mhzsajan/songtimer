<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<title>Ritu</title>
<style>
  /* Transparent so the Browser Source composites straight over the camera.
     OBS applies body{background-color:rgba(0,0,0,0)} by default; this makes it
     explicit so the page still looks right if that default is ever changed. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #lyric {
    font: 500 8vh/1.25 "Noto Sans Devanagari", "Mangal", "Nirmala UI", "Microsoft New Tai Lue", sans-serif;
    color: #fff; text-align: center; padding: 0 4vw;
    text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 34px rgba(0,0,0,.6);
    /* Legible over any camera feed without needing a background plate. */
  }
  #up { color: #9aa7b4; font-size: 5.4vh; margin-top: 1.4vh; }
</style>
</head>
<body>
<div id="lyric"><div id="now"></div><div id="up"></div></div>
<script>
  // Generated by Song Timer. Times are inlined, so this page is standalone.
  // (The tag above is built from a fragment -- see the note on TAG.)
  const DATA = {"title":"Ritu","lines":[{"t":66.45,"e":67.1,"x":"फर्केर आउने छैन"},{"t":70.19,"e":71.3,"x":"म कुनै ऋतु होइन"},{"t":75,"e":null,"x":"मेरो आश नगर,"}]};

  // A line ends at its recorded end, or at the next line's start when no end
  // was timed -- the same fallback the video renderer uses, so both agree.
  const LINES = DATA.lines.map(function (l, i) {
    const next = i + 1 < DATA.lines.length ? DATA.lines[i + 1].t : null;
    let end = l.e;
    if (end == null) end = next != null ? next : l.t + 3;
    if (end <= l.t) end = l.t + 0.8;
    return { t: l.t, e: end, x: l.x };
  });

  const nowEl = document.getElementById("now");
  const upEl = document.getElementById("up");
  let shown = -1;

  function paint(t) {
    let idx = -1;
    for (let i = 0; i < LINES.length; i++) {
      if (LINES[i].t <= t) idx = i;
    }
    if (idx === shown) return;
    shown = idx;
    if (idx < 0) { nowEl.textContent = ""; upEl.textContent = ""; return; }
    nowEl.textContent = LINES[idx].x;
    // The next line sits above, dimmed, so the audience can read ahead.
    upEl.textContent = idx + 1 < LINES.length ? LINES[idx + 1].x : "";
  }

  // Driven by a clock the page starts itself. For a live set, replace this with
  // a shared timecode if you sync to a mixer rather than to playback here.
  let t0 = null;
  function loop() {
    if (t0 === null) t0 = performance.now();
    paint((performance.now() - t0) / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Keyboard control so it can be started, stopped and nudged live.
  addEventListener("keydown", function (e) {
    if (e.key === " ") { t0 = t0 === null ? performance.now() : null; e.preventDefault(); }
    else if (e.key === "ArrowRight") t0 -= 2000;
    else if (e.key === "ArrowLeft") t0 += 2000;
    else if (e.key === "r") t0 = performance.now();
  });
</script>
</body>
</html>
